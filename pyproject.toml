[project]
name = "canvasapi-get"
version = "0.1.0"
description = "GET-only Canvas LMS API library with async pagination and optional MCP server"
authors = [
    {name = "ts3448"}
]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["canvas", "lms", "api", "mcp", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Core dependencies for Canvas API functionality
dependencies = [
    "arrow>=1.3.0",
    "pytz>=2025.2",
    "requests>=2.32.4",
    "aiohttp>=3.12.13", 
    "python-dotenv>=1.1.0",
    "aiofiles>=24.1.0",
    "aiodns>=3.5.0",
    "charset-normalizer>=3.4.2"
]

# Optional MCP server dependencies
[project.optional-dependencies]
mcp = [
    "pandas>=2.0.0",
    "mcp>=1.0.0", 
    "numpy>=1.24.0"
]

# Entry points for MCP server
[project.scripts]
canvasapi-mcp = "canvasapi_mcp:main"

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["canvasapi_get*", "canvasapi_mcp*"]

[tool.setuptools.package-data]
canvasapi_mcp = ["*.json"]
